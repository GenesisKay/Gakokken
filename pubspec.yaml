name: gakoken
description: "Gakoken - Explorador de archivos rapido."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  hive_ce: ^2.11.0
  hive_ce_flutter: ^2.3.0
  google_fonts: ^6.2.1
  intl: ^0.20.2
  file_picker: ^8.0.0+1
  uuid: ^4.5.1
  gakoken_core:
    path: rust_builder
  flutter_rust_bridge: 2.13.0
  permission_handler: ^11.4.0
  path_provider: ^2.1.5
  device_info_plus: ^12.4.0
  share_plus: ^12.0.2
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  generate: true
  uses-material-design: true
