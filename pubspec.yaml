name: gakoken
description: "Gakoken - Explorador de archivos rapido."
publish_to: 'none'

version: 1.1.0+9

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  hive_ce: ^2.11.0
  hive_ce_flutter: ^2.3.0
  google_fonts: ^6.2.1
  intl: ^0.20.2
  file_picker: ^8.0.0+1
  uuid: ^4.5.1
  gakoken_core:
    path: rust_builder
  flutter_rust_bridge: 2.13.0
  permission_handler: ^11.4.0
  path_provider: ^2.1.5
  device_info_plus: ^12.4.0
  share_plus: ^12.0.2
  path: ^1.9.1
  url_launcher: ^6.3.2
  package_info_plus: ^9.0.1
  home_widget: ^0.9.2+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.1

flutter:
  generate: true
  uses-material-design: true
  # Montserrat va dentro de la app: sin permiso de internet, google_fonts no
  # la puede descargar. google_fonts usa estos archivos por su nombre.
  assets:
    - assets/google_fonts/

flutter_launcher_icons:
  android: true
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#E65C00"
  adaptive_icon_foreground: "assets/images/app_icon.png"
  windows:
    generate: true
    image_path: "assets/images/app_icon.png"
    icon_size: 256

# Splash de la serie Origami: fondo del color principal del tema de la app y
# el logo al centro (Origami-Base/diseno/splash.md). Regenerar con:
#   dart run flutter_native_splash:create
flutter_native_splash:
  color: "#E65C00"
  image: assets/images/app_icon.png
  android_12:
    image: assets/images/app_icon.png
    color: "#E65C00"
  web: false
